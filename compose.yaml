services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  seeder:
    build:
      context: .
      dockerfile: Seeder/Dockerfile
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__DatabaseName: erp
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  erp:
    build:
      context: .
      dockerfile: ERP/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__DatabaseName: erp
    depends_on:
      mongo:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - erp